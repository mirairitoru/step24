# fly.toml app configuration file generated for animal-app-vivid-echo-3496 on 2026-08-01T15:40:34+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'animal-app-vivid-echo-3496'
primary_region = 'nrt'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  APP_URL = 'https://animal-app-vivid-echo-3496.fly.dev'
  APP_NAME = '保護動物犬猫マッチング未来のペット'
  APP_DEBUG = 'true'
  APP_LOCALE = 'ja'
  APP_FALLBACK_LOCALE = 'ja'
  APP_FAKER_LOCALE = 'ja_JP'
  APP_MAINTENANCE_DRIVER = 'file'
  DB_CONNECTION = 'pgsql'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  SESSION_LIFETIME = '120'
  SESSION_ENCRYPT = 'false'
  SESSION_PATH = '/'
  SESSION_DOMAIN = 'null'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[deploy]
release_command = "sh -c 'DB_URL=$DIRECT_DATABASE_URL php /var/www/html/artisan migrate --force'"